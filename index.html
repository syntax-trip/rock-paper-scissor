<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RockPaperScissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <p class="para" id="heading">Cyber Hack Battle</p>
    <img id="hackerimg" src="hacker-hacking-system-illustration-svg-download-png-6621908.png" alt="Hacker img">
    <p id="story" >You vs Hacker . Reach 5 wins before it does !!</p>

<div class="divbtns">
    <button onclick="" class="btnemoji" id="rock-btn"><img src="" alt="">🪨</button>
    <button onclick="" class="btnemoji" id="paper-btn"><img src="" alt="">📄</button>
    <button onclick="" class="btnemoji" id="scissors-btn"><img src="" alt="">✂️</button>
</div>

<p id="result"></p>

<div id="scoreBoard">
    <p class="scores" id="humanScoreBoard">You : 0</p>
    <p class="scores" id="hackerScoreBoard">Hacker : 0</p>
</div>

<button id="resetbtn">Reset</button>

</div>
    <script src="index.js"></script>
</body>
</html>
